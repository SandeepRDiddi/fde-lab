# FDE Lab — Phase 1-2 local deployment (architecture.md → Deployment).
#
# Usage:
#   cd infra && docker compose up            # single cohort, defaults below
#
# Multiple cohorts side by side (FDE-010 AC4), each isolated (own network, own
# named volumes, own containers — Compose prefixes all of these with the
# project name automatically):
#   docker compose -p cohort-a --env-file .env.cohort-a -f docker-compose.yml up -d
#   docker compose -p cohort-b --env-file .env.cohort-b -f docker-compose.yml up -d
# Each env file only needs to override the *_PORT vars (see .env.example) so
# the two cohorts don't collide on published host ports.
#
# Full scenario end to end once the stack is healthy:
#   1. POST /scenario-instances on backend (${BACKEND_PORT}) to create an instance
#   2. docker compose run --rm data-gen python -m generator <instance-id>
#   3. talk to the persona via persona-service (${PERSONA_PORT})
# There is no frontend service here yet — frontend/ doesn't exist in this repo
# yet (FDE-008 is still in review), see stories/FDE-010-*.md implementation log.

name: ${COMPOSE_PROJECT_NAME:-fde-lab}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fde}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fde}
      POSTGRES_DB: ${POSTGRES_DB:-fde_lab}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fde} -d ${POSTGRES_DB:-fde_lab}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # MinIO pulled its images from Docker Hub entirely (minio/minio and
    # minio/mc both 403 there now) -- quay.io is the current official home.
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    # No Docker-level healthcheck here: recent minio/minio images dropped
    # curl (the tool every commonly-copied healthcheck for this image
    # assumes), so a curl-based check just fails forever and blocks
    # everything depending on service_healthy. minio-init's own retry loop
    # below establishes readiness instead.

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} >/dev/null 2>&1; do sleep 1; done &&
      mc mb --ignore-existing local/${S3_BUCKET:-fde-lab-datasets}
      "
    restart: "no"

  legacy-api:
    build:
      context: ../mocks/legacy-api
    image: fde-lab-legacy-api:local
    # Internal-only -- the backend proxies to this (app/routers/legacy_system.py)
    # rather than a student calling it directly, so no host port is published.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend-migrate:
    build:
      context: ../backend
    image: fde-lab-backend:local
    environment:
      FDE_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-fde}:${POSTGRES_PASSWORD:-fde}@postgres:5432/${POSTGRES_DB:-fde_lab}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  persona-migrate:
    build:
      context: ../persona-service
    image: fde-lab-persona:local
    environment:
      FDE_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-fde}:${POSTGRES_PASSWORD:-fde}@postgres:5432/${POSTGRES_DB:-fde_lab}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  backend:
    build:
      context: ../backend
    image: fde-lab-backend:local
    environment:
      FDE_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-fde}:${POSTGRES_PASSWORD:-fde}@postgres:5432/${POSTGRES_DB:-fde_lab}
      FDE_REDIS_URL: redis://redis:6379/0
      FDE_LEGACY_API_BASE_URL: http://legacy-api:8000
      # FDE-013: grading a technical-task submission fetches the scenario's
      # own synthetic dataset from the same MinIO bucket data-gen writes to.
      FDE_S3_ENDPOINT_URL: http://minio:9000
      FDE_S3_BUCKET: ${S3_BUCKET:-fde-lab-datasets}
      FDE_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      FDE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # FDE-014: scenario generator, same free local Ollama instance
      # persona-service already talks to -- see that service's own comment
      # on this same env var for why (no hosted-API cost for a training lab).
      FDE_PROMPTOPS_GATEWAY_URL: http://host.docker.internal:11434
      FDE_PROMPTOPS_GATEWAY_MODEL: llama3.2:3b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  celery-worker:
    build:
      context: ../backend
    image: fde-lab-backend:local
    command: ["celery", "-A", "app.celery_app", "worker", "--loglevel=info"]
    environment:
      FDE_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-fde}:${POSTGRES_PASSWORD:-fde}@postgres:5432/${POSTGRES_DB:-fde_lab}
      FDE_REDIS_URL: redis://redis:6379/0
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 15s

  persona-service:
    build:
      context: ../persona-service
    image: fde-lab-persona:local
    extra_hosts:
      # host.docker.internal resolves automatically on Docker Desktop
      # (Mac/Windows) but not on native Linux Docker Engine without this.
      - "host.docker.internal:host-gateway"
    environment:
      FDE_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-fde}:${POSTGRES_PASSWORD:-fde}@postgres:5432/${POSTGRES_DB:-fde_lab}
      # PromptOps Gateway isn't part of this repo (architecture.md open
      # question) — defaults to a local Ollama instance on the host machine
      # (free, no hosted-API cost for a training lab). Requires Ollama
      # running on the host with the configured model already pulled
      # (`ollama pull llama3.2:3b`). Override PROMPTOPS_GATEWAY_URL once a real
      # gateway exists.
      FDE_PROMPTOPS_GATEWAY_URL: ${PROMPTOPS_GATEWAY_URL:-http://host.docker.internal:11434}
      FDE_PROMPTOPS_GATEWAY_API_KEY: ${PROMPTOPS_GATEWAY_API_KEY:-}
      FDE_PROMPTOPS_GATEWAY_MODEL: ${PROMPTOPS_GATEWAY_MODEL:-llama3.2:3b}
    ports:
      - "${PERSONA_PORT:-8001}:8000"
    depends_on:
      persona-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ../frontend
    image: fde-lab-frontend:local
    environment:
      BACKEND_URL: http://backend:8000
      PERSONA_SERVICE_URL: http://persona-service:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
      persona-service:
        condition: service_healthy

  data-gen:
    build:
      context: ../data-gen
    environment:
      FDE_S3_ENDPOINT_URL: http://minio:9000
      FDE_S3_BUCKET: ${S3_BUCKET:-fde-lab-datasets}
      FDE_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      FDE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      FDE_BACKEND_BASE_URL: http://backend:8000
    depends_on:
      minio-init:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    profiles:
      - tools

volumes:
  postgres-data:
  minio-data:
