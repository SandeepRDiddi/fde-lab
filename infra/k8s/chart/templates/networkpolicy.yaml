# AC4: keeps each cohort's data/mocks/scenario state fully isolated at the
# network layer, not just by namespace naming convention. Two policies:
#   1. Default-deny all ingress from outside this namespace.
#   2. Allow ingress from the ingress-controller's namespace to the
#      frontend Service only (the one public entry point) and unrestricted
#      traffic between pods inside this same namespace (so
#      backend/celery-worker/persona-service/postgres/redis/minio/frontend
#      can still all talk to each other).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-cross-namespace
  namespace: {{ include "cohort.namespace" . }}
  labels:
    {{- include "cohort.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-controller-to-frontend
  namespace: {{ include "cohort.namespace" . }}
  labels:
    {{- include "cohort.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: frontend
      fde-lab/cohort-id: {{ include "cohort.slug" . }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.ingress.controllerNamespace }}
      ports:
        - protocol: TCP
          port: 3000
