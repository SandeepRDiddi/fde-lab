# Equivalent of docker-compose.yml's persona-migrate one-shot service.
# Independent of backend-migrate (separate alembic_version table, per
# FDE-010's merge-review fix), so both run at the same hook weight.
apiVersion: batch/v1
kind: Job
metadata:
  name: persona-migrate
  namespace: {{ include "cohort.namespace" . }}
  labels:
    {{- include "cohort.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "cohort.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.postgres.image }}
          command:
            - /bin/sh
            - -c
            - until pg_isready -h postgres -U {{ .Values.postgres.user | quote }} -d {{ .Values.postgres.db | quote }}; do sleep 2; done
      containers:
        - name: persona-migrate
          image: {{ .Values.images.persona }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          env:
            - name: FDE_DATABASE_URL
              value: {{ include "cohort.databaseUrl" . | quote }}
