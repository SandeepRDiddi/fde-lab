apiVersion: apps/v1
kind: Deployment
metadata:
  name: persona-service
  namespace: {{ include "cohort.namespace" . }}
  labels:
    {{- include "cohort.labels" . | nindent 4 }}
    app: persona-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: persona-service
      fde-lab/cohort-id: {{ include "cohort.slug" . }}
  template:
    metadata:
      labels:
        app: persona-service
        fde-lab/cohort-id: {{ include "cohort.slug" . }}
    spec:
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.postgres.image }}
          command:
            - /bin/sh
            - -c
            - until pg_isready -h postgres -U {{ .Values.postgres.user | quote }} -d {{ .Values.postgres.db | quote }}; do sleep 2; done
      containers:
        - name: persona-service
          image: {{ .Values.images.persona }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - name: FDE_DATABASE_URL
              value: {{ include "cohort.databaseUrl" . | quote }}
            - name: FDE_PROMPTOPS_GATEWAY_URL
              value: {{ .Values.promptopsGateway.url | quote }}
            - name: FDE_PROMPTOPS_GATEWAY_MODEL
              value: {{ .Values.promptopsGateway.model | quote }}
            - name: FDE_PROMPTOPS_GATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cohort-secrets
                  key: FDE_PROMPTOPS_GATEWAY_API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources.medium | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: persona-service
  namespace: {{ include "cohort.namespace" . }}
  labels:
    {{- include "cohort.labels" . | nindent 4 }}
spec:
  selector:
    app: persona-service
    fde-lab/cohort-id: {{ include "cohort.slug" . }}
  ports:
    - port: 8000
      targetPort: 8000
