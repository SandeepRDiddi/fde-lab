apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: {{ include "cohort.namespace" . }}
  labels:
    {{- include "cohort.labels" . | nindent 4 }}
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
      fde-lab/cohort-id: {{ include "cohort.slug" . }}
  template:
    metadata:
      labels:
        app: frontend
        fde-lab/cohort-id: {{ include "cohort.slug" . }}
    spec:
      containers:
        - name: frontend
          image: {{ .Values.images.frontend }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - containerPort: 3000
          env:
            # Server-side only -- the frontend's own /api/* routes proxy to
            # these, the browser never calls backend/persona-service
            # directly (CLAUDE.md: no CORS config needed on either).
            - name: BACKEND_URL
              value: "http://backend:8000"
            - name: PERSONA_SERVICE_URL
              value: "http://persona-service:8000"
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources.medium | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: {{ include "cohort.namespace" . }}
  labels:
    {{- include "cohort.labels" . | nindent 4 }}
spec:
  selector:
    app: frontend
    fde-lab/cohort-id: {{ include "cohort.slug" . }}
  ports:
    - port: 3000
      targetPort: 3000
